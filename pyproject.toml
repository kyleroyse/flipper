[project]
name = "flipper"
version = "0.1.0"
description = "Audio research agent with LangGraph, Grok 4.6 primary, OpenAI backup"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "librosa>=1.0.0",
    "soundfile>=0.14.0",
    "scipy>=1.18.0",
    "numpy>=2.5.0",
    "matplotlib>=3.11.0",
    "pandas>=3.0.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.9.0",
    "pydub>=0.25.1",
    "audioread>=3.1.0",
    "noisereduce>=3.0.0",
    "resampy>=0.4.3",
    "pyAudioAnalysis>=0.3.14",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "xai-sdk>=1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.0.0",
]

[project.scripts]
flipper = "main:main"
flipper-session = "flipper.graphs.analysis_session:main"
flipper-extract = "flipper.extract_burst_pulses:main"

[tool.hatch.build.targets.wheel]
packages = ["flipper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
